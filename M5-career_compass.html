<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карьерный компас</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Библиотека для сохранения результата в виде картинки -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ─── БАЗОВЫЙ КАРКАС И ОТСТУПЫ ─── */
#capture-area {
  max-width: 720px;
  margin: 0 auto;
  padding: 44px 20px 20px;
  background: var(--cream);
}
.bottom-actions {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 60px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─── ИНТРО ─── */
.intro-meta {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.intro-meta-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.intro-meta-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  color: var(--dark);
}
.intro-meta-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--slate);
}
.intro-author {
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--slate);
  text-align: center;
}

/* ─── ДИАГНОСТИКА (КАРТОЧКИ) ─── */
.cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 12px;
}
.compass-card {
  text-align: left;
  padding: 24px 20px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  transition: all 0.2s;
}
.compass-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--dark);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.2s;
}
.compass-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,59,72,0.08);
  border-color: var(--dark);
}
.compass-card:hover::before,
.compass-card.card--selected::before {
  transform: scaleY(1);
}
.compass-card.card--selected {
  border-color: var(--red);
  background: var(--red-bg);
}
.compass-card.card--selected::before {
  background: var(--red);
}
.compass-card.other-selected {
  opacity: 0.4;
  pointer-events: none;
}

.card-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--sand);
  border: 1.5px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--slate);
  margin-bottom: 14px;
  transition: all 0.2s;
}
.compass-card.card--selected .card-letter {
  background: var(--red);
  color: var(--white);
  border-color: var(--red);
}

.card-text {
  font-size: 13px;
  line-height: 1.6;
  color: var(--slate);
  margin-bottom: 14px;
}
.compass-card.card--selected .card-text {
  color: var(--dark);
}

.card-anchor {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--slate);
  opacity: 0.7;
}
.compass-card.card--selected .card-anchor {
  color: var(--red);
  opacity: 1;
}

/* ─── РЕЗУЛЬТАТЫ ─── */
.scores-section { margin-bottom: 36px; }
.score-row {
  display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
.score-label {
  font-size: 13px; font-weight: 600; color: var(--dark); min-width: 180px;
}
.score-bar-wrap {
  flex: 1; height: 8px; background: var(--sand); border-radius: 4px; overflow: hidden;
}
.score-bar {
  height: 100%; border-radius: 4px; background: var(--border); transition: width 1s ease;
}
.score-bar.top { background: var(--red); }
.score-bar.second { background: var(--dark); }
.score-num {
  font-size: 13px; font-weight: 700; color: var(--slate); min-width: 20px; text-align: right;
}

.desc-num {
  position: absolute; top: -10px; left: 16px; background: var(--white);
  padding: 0 8px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--slate);
}
.desc-card {
  position: relative; padding: 20px; margin-bottom: 16px; border: 1.5px solid var(--border);
  background: var(--white); border-radius: 8px;
}
.desc-card.highlighted {
  border-color: var(--red); background: var(--red-bg);
}
.desc-card.highlighted .desc-num {
  color: var(--red); background: var(--red-bg);
}
.desc-card.highlighted-2 {
  border-color: var(--dark); background: var(--sand);
}
.desc-card.highlighted-2 .desc-num {
  color: var(--dark); background: var(--sand);
}
.desc-anchor-name {
  font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 8px;
}
.desc-text {
  font-size: 13px; line-height: 1.65; color: var(--slate);
}

@media (max-width: 520px) {
  .cards-row { grid-template-columns: 1fr; }
  .score-label { min-width: 130px; font-size: 12px; }
  .bottom-actions { flex-direction: column; }
  .bottom-actions .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<div id="capture-area" class="page-wrap">
  <div id="app"></div>
</div>

<div class="bottom-actions">
  <button id="save-btn" class="btn btn--secondary" disabled onclick="saveResult()">↓ Сохранить результат</button>
  <button id="restart-btn" class="btn btn--secondary hidden" onclick="restartQuiz()">↺ Пройти заново</button>
</div>

<script src="common.js"></script>
<script>
const PAIRS =[
  {
    a: { text: "Возглавить крупное подразделение и отвечать за достижение ключевых бизнес-показателей всей структуры.", anchor: "Менеджмент", key: "management" },
    b: { text: "Стать признанным экспертом в своей узкой области, к которому обращаются за решением самых сложных профессиональных задач.", anchor: "Техническая компетентность", key: "technical" }
  },
  {
    a: { text: "Работать в условиях полной свободы действий, самостоятельно определяя график, методы и стандарты выполнения своих задач.", anchor: "Автономия", key: "autonomy" },
    b: { text: "Работать в стабильной компании с чёткими регламентами, понятной системой льгот и гарантией долгосрочной занятости.", anchor: "Безопасность", key: "security" }
  },
  {
    a: { text: "Создать внутри организации принципиально новый проект или продукт, который станет вашим личным достижением и визитной карточкой.", anchor: "Предпринимательство", key: "entrepreneurship" },
    b: { text: "Получить вызов в виде критически сложной, почти невыполнимой задачи, решение которой потребует предельной концентрации усилий.", anchor: "Вызов", key: "challenge" }
  },
  {
    a: { text: "Иметь возможность гибко совмещать работу и личные интересы, сохраняя достаточно времени на семью и хобби.", anchor: "Стиль жизни", key: "lifestyle" },
    b: { text: "Заниматься работой, которая позволяет реализовывать ваши личные ценности и приносить реальную пользу обществу или коллегам.", anchor: "Служение / Увлечённость", key: "service" }
  },
  {
    a: { text: "Управлять процессами и бюджетами, координируя работу разных функциональных блоков для успеха всей организации.", anchor: "Менеджмент", key: "management" },
    b: { text: "Реализовать идею собственного внутреннего стартапа, самостоятельно подбирая команду и выводя продукт на рынок.", anchor: "Предпринимательство", key: "entrepreneurship" }
  },
  {
    a: { text: "Постоянно совершенствовать своё мастерство в выбранной профессии, становясь всё более ценным специалистом-практиком.", anchor: "Техническая компетентность", key: "technical" },
    b: { text: "Работать в организации, где выстроена надёжная система социального обеспечения и предсказуемый карьерный путь на годы вперёд.", anchor: "Безопасность", key: "security" }
  },
  {
    a: { text: "Выполнять задачи своим способом, без жёсткого контроля со стороны руководства и привязки к офисному распорядку.", anchor: "Автономия", key: "autonomy" },
    b: { text: "Регулярно браться за решение проблем, с которыми никто в компании не смог справиться до вас.", anchor: "Вызов", key: "challenge" }
  },
  {
    a: { text: "Вкладывать силы в проекты, которые делают жизнь людей лучше или решают важные экологические и социальные проблемы.", anchor: "Служение / Увлечённость", key: "service" },
    b: { text: "Занять высокую административную должность, которая даёт статус и право влиять на стратегические решения всей компании.", anchor: "Менеджмент", key: "management" }
  },
  {
    a: { text: "Выбирать место работы в зависимости от того, насколько корпоративная культура уважает границы личного времени сотрудника.", anchor: "Стиль жизни", key: "lifestyle" },
    b: { text: "Совершенствовать свои навыки до уровня, когда вы сможете решать профессиональные задачи любой степени сложности.", anchor: "Техническая компетентность", key: "technical" }
  },
  {
    a: { text: "Иметь долгосрочный контракт и уверенность в завтрашнем дне, даже если работа со временем станет рутинной.", anchor: "Безопасность", key: "security" },
    b: { text: "Рискнуть стабильностью ради возможности запустить новое направление бизнеса с неочевидными перспективами.", anchor: "Предпринимательство", key: "entrepreneurship" }
  }
];

const ANCHOR_INFO = {
  management:     { name: "Менеджмент",               num: 1, desc: "Способность видеть организацию как единое целое, связывать разрозненные функциональные блоки, управлять бизнес-процессом. Ключевые ценности — возможности для лидерства, повышение ответственности и вклад в успех своей организации." },
  technical:      { name: "Техническая компетентность", num: 2, desc: "Фокус на своей профессиональной области. Стремление быть мастером своего дела, развивать и совершенствовать навыки, решать самые сложные задачи в своей специализации." },
  autonomy:       { name: "Автономия / Независимость", num: 3, desc: "Сложно следовать установленным правилам и процедурам. Эти люди любят выполнять работу своим способом и по собственным стандартам, склонны организовывать собственные проекты." },
  entrepreneurship:{ name: "Предпринимательство",      num: 4, desc: "Нравится создавать стартапы, начинать новые проекты внутри организации. Выводить на рынок новые товары и услуги, которые могут быть отождествлены с их личными усилиями." },
  service:        { name: "Служение / Увлечённость",   num: 5, desc: "Вовлечённость в работу, любовь к своему делу. Реализация в работе личных ценностей — желание приносить реальную пользу обществу, коллегам или конкретным людям." },
  lifestyle:      { name: "Стиль жизни",               num: 6, desc: "Карьера ассоциируется с общим стилем жизни. Важен баланс работы и личной жизни, уважение работодателя к личным и семейным потребностям сотрудника." },
  challenge:      { name: "Вызов",                     num: 7, desc: "Готовность к сложным задачам и преодолению препятствий. Вызовы воспринимаются не как угроза, а как возможность проявить себя. Скука — главный враг этих людей." },
  security:       { name: "Безопасность",              num: 8, desc: "Ценность стабильности и предсказуемости. Поиск постоянной занятости с минимальной вероятностью увольнения. Потребность в безопасности может ограничивать выбор, но даёт устойчивость." }
};

let state = {
  screen: 'intro',
  currentPair: 0,
  scores: { management: 0, technical: 0, autonomy: 0, entrepreneurship: 0, service: 0, lifestyle: 0, challenge: 0, security: 0 },
  answers:[],
  transitioning: false
};

function render() {
  const app = document.getElementById('app');
  const saveBtn = document.getElementById('save-btn');
  const restartBtn = document.getElementById('restart-btn');

  if (state.screen === 'intro') {
    app.innerHTML = renderIntro();
    saveBtn.disabled = true;
    restartBtn.classList.add('hidden');
  } else if (state.screen === 'quiz') {
    app.innerHTML = renderQuiz();
    saveBtn.disabled = true;
    restartBtn.classList.add('hidden');
  } else if (state.screen === 'results') {
    app.innerHTML = renderResults();
    saveBtn.disabled = false;
    restartBtn.classList.remove('hidden');
  }
  
  // Уведомляем Moodle об изменении высоты
  notifyHeight();
}

function renderIntro() {
  return `<div class="intro anim-fade-up" style="text-align: center;">
    <h1 class="page-title">Карьерный <span>Компас</span></h1>
    <div class="divider"></div>
    <div class="legend-box" style="text-align: left;">
      <div class="legend-tag">О чём опрос</div>
      Узнайте, какие внутренние мотивы управляют вашими карьерными решениями. 10 пар утверждений помогут выявить ваши ведущие карьерные ориентиры (якоря).
    </div>
    <div class="intro-meta">
      <div class="intro-meta-item">
        <div class="intro-meta-num">10</div>
        <div class="intro-meta-label">пар выборов</div>
      </div>
      <div class="intro-meta-item">
        <div class="intro-meta-num">8</div>
        <div class="intro-meta-label">якорей</div>
      </div>
      <div class="intro-meta-item">
        <div class="intro-meta-num">5</div>
        <div class="intro-meta-label">минут</div>
      </div>
    </div>
    <button class="btn btn--primary" onclick="startQuiz()">Начать →</button>
    <div class="intro-author">По методологии Эдгара Шейна · Career Anchors</div>
  </div>`;
}

function renderQuiz() {
  const pair = PAIRS[state.currentPair];
  const pct = (state.currentPair / PAIRS.length) * 100;
  const answered = state.answers[state.currentPair];

  const cardA = answered
    ? `compass-card ${answered === 'a' ? 'card--selected' : 'other-selected'}`
    : 'compass-card';
  const cardB = answered
    ? `compass-card ${answered === 'b' ? 'card--selected' : 'other-selected'}`
    : 'compass-card';

  return `<div class="quiz anim-fade-up">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px;">
      <div style="font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--slate); white-space:nowrap;">
        Пара <span style="color:var(--red)">${state.currentPair + 1}</span> из ${PAIRS.length}
      </div>
      <div class="progress" style="flex:1; margin:0;">
        <div class="progress__fill" style="width:${pct}%"></div>
      </div>
    </div>
    
    <div style="font-family:var(--font-display); font-size:clamp(18px, 4vw, 24px); font-weight:700; color:var(--dark); line-height:1.35; margin-bottom:32px;">
      Какой из вариантов отражает то, что важно лично вам?
    </div>
    
    <div class="cards-row anim-card-in">
      <div class="${cardA}" onclick="choose('a')" id="card-a">
        <div class="card-letter">А</div>
        <div class="card-text">${pair.a.text}</div>
        <div class="card-anchor">${pair.a.anchor}</div>
      </div>
      <div class="${cardB}" onclick="choose('b')" id="card-b">
        <div class="card-letter">Б</div>
        <div class="card-text">${pair.b.text}</div>
        <div class="card-anchor">${pair.b.anchor}</div>
      </div>
    </div>
    
    <div style="text-align:center; font-size:12px; color:var(--slate); opacity:0.7; letter-spacing:0.5px; margin-top:8px;">
      Оба варианта равноценны — выбирайте то, что ближе именно вам
    </div>
  </div>`;
}

function renderResults() {
  const sorted = Object.entries(state.scores)
    .map(([k, v]) => ({ key: k, val: v, ...ANCHOR_INFO[k] }))
    .sort((a, b) => b.val - a.val);

  const top1 = sorted[0];
  const top2 = sorted[1];
  const maxVal = sorted[0].val || 1;

  const barsHtml = sorted.map((item, i) => {
    const cls = i === 0 ? 'top' : i === 1 ? 'second' : '';
    const w = Math.round((item.val / maxVal) * 100);
    return `<div class="score-row">
      <div class="score-label">${item.name}</div>
      <div class="score-bar-wrap">
        <div class="score-bar ${cls}" id="bar-${item.key}" style="width:0%" data-w="${w}"></div>
      </div>
      <div class="score-num">${item.val}</div>
    </div>`;
  }).join('');

  const descHtml = sorted.slice(0, 4).map((item, i) => {
    const cls = i === 0 ? 'desc-card highlighted' : i === 1 ? 'desc-card highlighted-2' : 'desc-card';
    const label = i === 0 ? 'Ведущий якорь' : i === 1 ? 'Второй якорь' : `Якорь ${i+1}`;
    return `<div class="${cls}">
      <div class="desc-num">${label}</div>
      <div class="desc-anchor-name">${item.name}</div>
      <div class="desc-text">${item.desc}</div>
    </div>`;
  }).join('');

  return `<div class="results anim-fade-up" id="results-block">
    <div style="text-align:center; margin-bottom:40px; padding-bottom:40px; border-bottom:1px solid var(--border);">
      <h2 class="page-title" style="font-size: clamp(26px, 5vw, 38px); margin-bottom: 24px;">Ведущие карьерные ориентиры</h2>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;">
        <span class="badge" style="background:var(--dark); color:var(--white); font-size:14px; padding:10px 16px;">✦ ${top1.name}</span>
        <span class="badge" style="background:var(--sand); border:1px solid var(--border); color:var(--dark); font-size:14px; padding:10px 16px;">◇ ${top2.name}</span>
      </div>
    </div>

    <div class="scores-section">
      <div style="font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--slate); margin-bottom:20px;">
        Распределение по якорям
      </div>
      ${barsHtml}
    </div>

    <div class="descriptions-section">
      <div style="font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--slate); margin-bottom:20px;">
        Что это означает для вас
      </div>
      ${descHtml}
    </div>

    <div class="feedback feedback--info mt-m">
      <strong>О методологии:</strong> Концепция карьерных якорей разработана профессором МТИ Эдгаром Шейном. Якорь — это та ценность или мотив, от которого человек не готов отказаться при принятии карьерных решений. Знание своего якоря помогает делать осознанный карьерный выбор.
    </div>
  </div>`;
}

function startQuiz() {
  state.screen = 'quiz';
  state.currentPair = 0;
  render();
}

function choose(choice) {
  if (state.transitioning) return;
  const pair = PAIRS[state.currentPair];
  const selected = choice === 'a' ? pair.a : pair.b;

  state.answers[state.currentPair] = choice;
  state.scores[selected.key]++;

  const cardA = document.getElementById('card-a');
  const cardB = document.getElementById('card-b');
  if (!cardA || !cardB) return;

  if (choice === 'a') {
    cardA.classList.add('card--selected');
    cardB.classList.add('other-selected');
  } else {
    cardB.classList.add('card--selected');
    cardA.classList.add('other-selected');
  }

  state.transitioning = true;
  setTimeout(() => {
    state.transitioning = false;
    state.currentPair++;
    if (state.currentPair >= PAIRS.length) {
      state.screen = 'results';
      render();
      setTimeout(animateBars, 100);
    } else {
      render();
    }
  }, 520);
}

function animateBars() {
  document.querySelectorAll('.score-bar').forEach(bar => {
    const w = bar.getAttribute('data-w');
    bar.style.width = w + '%';
  });
}

function restartQuiz() {
  state = {
    screen: 'intro',
    currentPair: 0,
    scores: { management: 0, technical: 0, autonomy: 0, entrepreneurship: 0, service: 0, lifestyle: 0, challenge: 0, security: 0 },
    answers: [],
    transitioning: false
  };
  render();
}

async function saveResult() {
  const btn = document.getElementById('save-btn');
  const originalText = btn.innerText;
  btn.innerText = '⏳ Сохранение...';
  btn.disabled = true;

  try {
    const element = document.getElementById('capture-area');
    const canvas = await html2canvas(element, {
      backgroundColor: '#FAF8F4',
      scale: 2,
      useCORS: true
    });

    const link = document.createElement('a');
    link.download = 'career-anchors-result.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (error) {
    console.error('Ошибка при сохранении:', error);
    alert('Ошибка при сохранении изображения.');
  } finally {
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

// Инициализация
render();
</script>
</body>
</html>
