<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приборная панель руководителя</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ── Сетка карточек ── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0 0;
    }

    /* ── Карточка процесса ── */
    .mgmt-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 14px 12px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .mgmt-card:hover {
      border-color: var(--slate);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,59,72,0.09);
    }

    .mgmt-card:active { transform: translateY(0); box-shadow: none; }

    .mgmt-card.state-green { border-color: var(--green); background: var(--green-bg); }
    .mgmt-card.state-amber { border-color: var(--amber); background: var(--amber-bg); }
    .mgmt-card.state-red   { border-color: var(--red);   background: var(--red-bg);   }

    .card-icon  { font-size: 22px; line-height: 1; margin-bottom: 2px; }

    .card-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.2;
    }

    .card-sub {
      font-size: 11px;
      color: var(--slate);
      line-height: 1.4;
    }

    .card-badge {
      margin-top: 8px;
      align-self: flex-start;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 3px;
    }

    .state-none  .card-badge { background: var(--sand);      color: var(--slate); border: 1px solid var(--border); }
    .state-green .card-badge { background: var(--green-bg);  color: var(--green); border: 1px solid var(--green-border); }
    .state-amber .card-badge { background: var(--amber-bg);  color: var(--amber); border: 1px solid var(--amber-border); }
    .state-red   .card-badge { background: var(--red-bg);    color: var(--red);   border: 1px solid var(--red-border); }

    /* ── Легенда ── */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .legend-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: var(--slate);
      line-height: 1.45;
    }

    .legend-item strong {
      color: var(--dark);
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    /* ── Нижняя панель ── */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .rated-label {
      font-size: 13px;
      color: var(--slate);
    }

    .rated-label strong {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      color: var(--dark);
    }

    /* ── Save-кнопка ── */
    #btnSave:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    /* ── Адаптив ── */
    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      .bottom-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <!-- Заголовок -->
  <h1 class="page-title">Приборная<span>панель</span></h1>
  <div class="divider"></div>
  <p class="lead-text">Нажмите на карточку, чтобы оценить управленческий процесс.</p>

  <!-- Легенда -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--green)"></div>
      <span><strong>Владею уверенно</strong> — процесс отлажен, работает предсказуемо</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--amber)"></div>
      <span><strong>В процессе</strong> — нет чёткой системы, результат нестабилен</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--red)"></div>
      <span><strong>Зона роста</strong> — источник проблем, требует внимания</span>
    </div>
  </div>

  <!-- Сетка карточек -->
  <div class="cards-grid" id="cardsGrid"></div>

  <!-- Нижняя панель: счётчик + кнопки (высота не меняется) -->
  <div class="bottom-bar">
    <div class="rated-label">Оценено: <strong id="ratedNum">0</strong> из 10</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn--secondary" onclick="resetAll()">↺ Сначала</button>
      <button class="btn btn--primary" id="btnSave" onclick="saveResult()" disabled>
        📸&nbsp; Скачать
      </button>
    </div>
  </div>

</div>

<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
var ITEMS = [
  { id: 'goal',  icon: '🎯', title: 'Постановка цели',     sub: 'Понимание «Куда и Зачем» идём'  },
  { id: 'plan',  icon: '📅', title: 'Планирование',        sub: 'Декомпозиция целей на задачи'   },
  { id: 'org',   icon: '⚙️', title: 'Организация',         sub: 'Распределение ресурсов'         },
  { id: 'ctrl',  icon: '🔍', title: 'Оценка, Контроль',    sub: 'Сверка факта и стандартов'      },
  { id: 'mot',   icon: '🔥', title: 'Мотивация',           sub: 'Вдохновение на результат'       },
  { id: 'team',  icon: '🤝', title: 'Работа с командой',   sub: 'Атмосфера и взаимодействие'     },
  { id: 'staff', icon: '👥', title: 'Расстановка кадров',  sub: 'Нужные люди на нужных местах'   },
  { id: 'deleg', icon: '📥', title: 'Делегирование',       sub: 'Передача полномочий'            },
  { id: 'comm',  icon: '💬', title: 'Коммуникация',        sub: 'Обмен информацией'              },
  { id: 'dev',   icon: '🚀', title: 'Развитие, Поддержка', sub: 'Обучение и наставничество'      },
];

/* Цикл: не оценено → Системно → Интуитивно → Проседает → Системно */
var CYCLE = [null, 'green', 'amber', 'red'];
var LABELS = { green: 'Владею уверенно', amber: 'В процессе', red: 'Зона роста' };

var ratings = {}; /* id → 'green' | 'amber' | 'red' | null */

/* ── Логика переключения ── */
function tap(id) {
  var cur = ratings[id] || null;
  var idx = CYCLE.indexOf(cur);
  /* Из null → green; из red → green (не возвращаем в null) */
  var next = (cur === null) ? 'green' : CYCLE[(idx + 1 > 3 ? 1 : idx + 1)];
  ratings[id] = next;

  /* Точечное обновление карточки — без перерисовки всей страницы */
  var card = document.getElementById('card-' + id);
  card.className = 'mgmt-card state-' + next;
  card.querySelector('.card-badge').textContent = LABELS[next];

  updateBottom();
  notifyHeight();
}

/* ── Счётчик ── */
function ratedCount() {
  return Object.keys(ratings).filter(function(k) { return ratings[k] !== null; }).length;
}

function updateBottom() {
  var count = ratedCount();
  document.getElementById('ratedNum').textContent = count;
  document.getElementById('btnSave').disabled = (count < ITEMS.length);
  notifyHeight();
}

/* ── Сохранение снимка ── */
function saveResult() {
  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ Формирую…';

  html2canvas(document.querySelector('.page-wrap'), {
    scale: 2,
    backgroundColor: '#FAF8F4',
    useCORS: true,
    logging: false
  }).then(function(canvas) {
    var a = document.createElement('a');
    a.download = 'приборная-панель-' + new Date().toLocaleDateString('ru-RU') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    btn.innerHTML = '✓&nbsp; Сохранено!';
    setTimeout(function() {
      btn.innerHTML = '📸&nbsp; Скачать';
      btn.disabled = false;
    }, 2500);
  }).catch(function() {
    alert('Не удалось создать снимок. Сделайте скриншот вручную.');
    btn.innerHTML = '📸&nbsp; Скачать';
    btn.disabled = false;
  });
}

/* ── Сброс ── */
function resetAll() {
  ratings = {};
  ITEMS.forEach(function(item) {
    var card = document.getElementById('card-' + item.id);
    card.className = 'mgmt-card state-none';
    card.querySelector('.card-badge').textContent = 'Оценить →';
  });
  updateBottom();
}

/* ── Инициализация ── */
(function init() {
  document.getElementById('cardsGrid').innerHTML = ITEMS.map(function(item) {
    return '<div class="mgmt-card state-none" id="card-' + item.id + '" onclick="tap(\'' + item.id + '\')">'
      + '<div class="card-icon">' + item.icon + '</div>'
      + '<div class="card-title">' + item.title + '</div>'
      + '<div class="card-sub">' + item.sub + '</div>'
      + '<div class="card-badge">Оценить →</div>'
      + '</div>';
  }).join('');
  updateBottom();
})();
</script>

</body>
</html>
