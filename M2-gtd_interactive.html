<style>
#app { max-width: 680px; margin: 0 auto; padding: 40px 20px 60px; }

/* ── Прогресс ── */
.progress-wrap { margin-bottom: 20px; }
.progress-meta {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;
}
.progress-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); }
.progress-frac  { font-family: var(--font-display); font-size: 17px; font-weight: 900; color: var(--dark); }
.progress-frac em { color: var(--red); font-style: normal; }
.progress-bar-bg   { height: 4px; background: var(--sand); border-radius: 2px; overflow: hidden; }
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--dark), var(--red));
  border-radius: 2px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
}

/* ── Источник сообщения ── */
.source-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--sand); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 14px;
  font-size: 11px; font-weight: 700; color: var(--slate);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
}

/* ── Сообщение ── */
.message-bubble {
  background: var(--sand); border-left: 4px solid var(--dark);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: 14px 16px; margin-bottom: 20px;
  font-size: 14px; color: var(--dark); line-height: 1.65;
}
.message-sender  { font-weight: 700; color: var(--dark); margin-bottom: 3px; font-size: 13px; }
.message-subject { font-size: 12px; color: var(--slate); margin-bottom: 6px; font-style: italic; }

/* ── GTD-дерево ── */
.gtd-flow {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; margin-bottom: 14px; flex-wrap: wrap;
}
.gtd-step {
  background: var(--sand); border-radius: 4px; padding: 3px 8px;
  color: var(--slate); font-weight: 600; font-size: 10px;
  letter-spacing: 0.5px;
}
.gtd-step.current { background: var(--dark); color: var(--white); }
.gtd-step.done    { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.gtd-arrow { color: var(--border); font-size: 10px; }

/* ── Точки шагов ── */
.step-dots { display: flex; gap: 6px; margin-bottom: 18px; }
.step-dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
.step-dot.active { background: var(--red); }
.step-dot.done   { background: var(--dark); }

/* ── Вопрос ── */
.question-text {
  font-family: var(--font-display); font-size: clamp(16px, 3vw, 20px);
  font-weight: 700; color: var(--dark); line-height: 1.3; margin-bottom: 6px;
}
.question-hint { font-size: 13px; color: var(--slate); margin-bottom: 16px; line-height: 1.5; }

/* ── Кнопки вариантов ── */
.answers { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.btn-answer {
  flex: 1; min-width: 130px; padding: 12px 16px;
  border-radius: var(--radius-md); border: 1.5px solid var(--border);
  background: var(--white); font-family: var(--font-body);
  font-size: 14px; font-weight: 600; color: var(--slate);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  text-align: center; -webkit-tap-highlight-color: transparent;
}
.btn-answer:hover:not(:disabled) { border-color: var(--dark); color: var(--dark); background: var(--sand); transform: translateY(-1px); }
.btn-answer.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.btn-answer.wrong   { border-color: var(--red);   background: var(--red-bg);   color: var(--red);   }
.btn-answer:disabled { opacity: 0.45; cursor: not-allowed; }

/* ── Папки ── */
.folders {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
}
.btn-folder {
  padding: 12px 10px; border-radius: var(--radius-md);
  border: 1.5px solid var(--border); background: var(--white);
  font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--slate);
  cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px;
  -webkit-tap-highlight-color: transparent;
}
.btn-folder:hover:not(:disabled) { border-color: var(--dark); color: var(--dark); background: var(--sand); transform: translateY(-1px); }
.btn-folder .folder-icon  { font-size: 20px; }
.btn-folder .folder-name  { font-size: 12px; font-weight: 700; color: var(--dark); }
.btn-folder .folder-sub   { font-size: 10px; color: var(--slate); font-weight: 400; }
.btn-folder.correct { border-color: var(--green); background: var(--green-bg); }
.btn-folder.correct .folder-name { color: var(--green); }
.btn-folder.wrong   { border-color: var(--red);   background: var(--red-bg);   }
.btn-folder.wrong   .folder-name { color: var(--red); }
.btn-folder:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Фидбэк ── */
.feedback-box {
  border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 12px;
  font-size: 13px; line-height: 1.6; display: none;
  animation: fadeUp 0.3s ease both;
}
.feedback-box.show     { display: block; }
.feedback-box.ok  { background: var(--green-bg); border-left: 4px solid var(--green); color: #1A4A35; }
.feedback-box.err { background: var(--red-bg);   border-left: 4px solid var(--red);   color: #7A1525; }
.feedback-head { font-weight: 700; margin-bottom: 4px; font-size: 12px; }

.btn-next {
  width: 100%; background: var(--dark); color: var(--white);
  border: none; border-radius: 4px; padding: 13px;
  font-family: var(--font-body); font-size: 13px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
  transition: background 0.15s; display: none;
}
.btn-next.show { display: block; }
.btn-next:hover { background: var(--red); }

/* ── Интро ── */
.intro-chars {
  display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0;
}
.char-chip {
  background: var(--sand); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--slate);
  display: flex; align-items: center; gap: 5px;
}
.intro-stats {
  display: flex; gap: 16px; font-size: 13px; color: var(--slate);
  margin-bottom: 20px; flex-wrap: wrap;
}

/* ── Финал ── */
.final-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
}
.stat-card {
  background: var(--sand); border-radius: var(--radius-md); padding: 16px; text-align: center;
}
.stat-num   { font-family: var(--font-display); font-size: 36px; font-weight: 900; color: var(--red); }
.stat-label { font-size: 12px; color: var(--slate); margin-top: 2px; }

.final-results {
  background: var(--sand); border-radius: var(--radius-md);
  padding: 16px; margin-bottom: 16px;
}
.final-results-title {
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--slate); margin-bottom: 12px;
}
.result-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--border);
  font-size: 13px; color: var(--dark);
}
.result-row:last-child { border-bottom: none; }
.result-outcome { font-weight: 700; color: var(--dark); min-width: 130px; font-size: 12px; }
.result-desc    { font-size: 12px; color: var(--slate); }

/* ── Фидбэк-оверлей (заменяет кнопки) ── */
.feedback-overlay {
  border-radius: var(--radius-md);
  padding: 16px 18px;
  font-size: 14px; line-height: 1.65;
  animation: fadeUp 0.25s ease both;
}
.feedback-overlay.ok  { background: var(--green-bg); border-left: 4px solid var(--green); color: #1A4A35; }
.feedback-overlay.err { background: var(--red-bg);   border-left: 4px solid var(--red);   color: #7A1525; }

.feedback-head { font-weight: 700; margin-bottom: 6px; font-size: 13px; }

.correct-hint {
  margin-top: 12px; padding: 10px 12px;
  background: rgba(0,0,0,0.06); border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; color: var(--dark);
}
.correct-hint-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--slate); margin-bottom: 4px;
}

/* ── Анимация ── */
@keyframes correctPulse {
  0%   { border-color: var(--border); background: var(--white); }
  40%  { border-color: var(--green);  background: var(--green-bg); }
  100% { border-color: var(--green);  background: var(--green-bg); }
}

@media (max-width: 480px) {
  .folders { grid-template-columns: 1fr 1fr; }
  .final-stats { grid-template-columns: 1fr 1fr; }
}
</style>

const FOLDERS = [
  { id:'trash',       icon:'🗑️', name:'В мусор',        sub:'Trash' },
  { id:'someday',     icon:'💡', name:'Может быть',      sub:'Someday / Maybe' },
  { id:'archive',     icon:'🗂️', name:'В архив',         sub:'Reference' },

  { id:'next_action', icon:'✅', name:'Список задач',    sub:'Next Actions' },

const GTD_LABELS = ['Входящее','Действие?','2 мин?','Делегировать?','Один шаг?','Время?'];

const OUTCOME_INFO = {
  trash:       { label:'🗑️ В мусор',           desc:'Информационный шум' },
  someday:     { label:'💡 Может быть',         desc:'Инициатива без срочности' },
  archive:     { label:'🗂️ В архив',            desc:'Справочная информация' },
  do_now:      { label:'⚡ Выполнить сразу',    desc:'Правило 2 минут' },
  delegate:    { label:'👤 Делегировать',       desc:'Не моя задача' },
  calendar:    { label:'📅 Запланировать',      desc:'Конкретное время' },
  next_action: { label:'✅ Список задач',       desc:'Контекстная задача' },
  project:     { label:'📁 Проект',             desc:'Многошаговая цель' },
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  screen: 'intro',
  caseIdx: 0,
  stepIdx: 0,
  answered: false,
  caseHadError: false,   // БАГ-ФИКС: флаг ошибки в текущем кейсе
  firstTryCorrect: 0,
  completedOutcomes: []
};

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'intro') app.innerHTML = renderIntro();
  else if (state.screen === 'final') app.innerHTML = renderFinal();
  else app.innerHTML = renderCase();
  notifyHeight();
}

function renderIntro() {
  return `<div class="anim-fade-up">
    <h1 class="page-title">Inbox Zero:<span>обработка входящих</span></h1>
    <div class="divider"></div>
    <div class="legend-box">
      <div class="legend-tag">Контекст</div>
      Вы — руководитель отдела. Утро понедельника. В вашем inbox накопилось

function renderFinal() {
  const pct = Math.round((state.firstTryCorrect / CASES.length) * 100);
  const rows = state.completedOutcomes.map(o => {
    const inf = OUTCOME_INFO[o] || {};
    return `<div class="result-row">
      <span class="result-outcome">${inf.label || o}</span>
      <span class="result-desc">${inf.desc || ''}</span>
    </div>`;
  }).join('');

  return `<div class="anim-fade-up">
    <div class="result-hero">
      <div class="result-hero__icon">🏆</div>
      <div class="result-hero__title">Inbox Zero достигнут!</div>
      <div class="result-hero__text">Вы успешно обработали все входящие. Паника отменена, фокус восстановлен.</div>
    </div>
    <div class="final-stats mt-sm">
      <div class="stat-card">
        <div class="stat-num">${state.firstTryCorrect}</div>
        <div class="stat-label">из ${CASES.length} с первой попытки</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${pct}%</div>
        <div class="stat-label">точность GTD-мышления</div>
      </div>
    </div>
    <div class="final-results">
      <div class="final-results-title">Что вы сделали с входящими</div>
      ${rows}
    </div>
    <button class="btn btn--secondary btn--full" onclick="restartGame()">↺ Пройти ещё раз</button>
  </div>`;
}

function renderCase() {
  const c = CASES[state.caseIdx];
  const step = c.steps[state.stepIdx];
  const progress = (state.caseIdx / CASES.length) * 100;
  const isLastStep = state.stepIdx === c.steps.length - 1;

  // GTD-поток
  const maxFlow = c.steps.length;
  const flowHtml = GTD_LABELS.slice(0, maxFlow + 1).map((s, i) => {
    let cls = 'gtd-step';
    if (i < step.gtdStep) cls += ' done';
    else if (i === step.gtdStep) cls += ' current';
    const arrow = i < maxFlow ? '<span class="gtd-arrow">▶</span>' : '';
    return `<span class="${cls}">${s}</span>${arrow}`;
  }).join('');

  // Точки шагов
  const dots = c.steps.map((_, i) => {
    let cls = 'step-dot';
    if (i < state.stepIdx) cls += ' done';
    else if (i === state.stepIdx) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  // Кнопки
  let buttonsHtml;
  if (step.isFolderPicker) {
    buttonsHtml = `<div class="folders">${FOLDERS.map(f =>
      `<button class="btn-folder" id="folder-${f.id}" onclick="answerFolder('${f.id}')">
        <span class="folder-icon">${f.icon}</span>
        <span class="folder-name">${f.name}</span>
        <span class="folder-sub">${f.sub}</span>
      </button>`
    ).join('')}</div>`;
  } else {
    buttonsHtml = `<div class="answers">${step.options.map((opt, i) =>
      `<button class="btn-answer" id="opt-${i}" onclick="answerOption(${i})">${opt}</button>`
    ).join('')}</div>`;
  }

  let sender = '';
  if (c.sender)  sender += `<div class="message-sender">${c.sender}</div>`;
  if (c.subject) sender += `<div class="message-subject">Тема: ${c.subject}</div>`;

  return `
    <div class="progress-wrap">
      <div class="progress-meta">
        <div class="progress-label">Кейс ${state.caseIdx + 1} из ${CASES.length}</div>
        <div class="progress-frac">${state.caseIdx + 1}<em>/${CASES.length}</em></div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width:${progress}%"></div>
      </div>
    </div>

    <div class="card anim-card-in">
      <div class="source-badge">${c.source} ${c.sourceLabel}</div>
      <div class="message-bubble">${sender}${c.text}</div>
      <div class="gtd-flow">${flowHtml}</div>
      <div class="step-dots">${dots}</div>
      <div class="question-text">${step.question}</div>
      <div class="question-hint">${step.hint}</div>
      <div id="buttons-area">${buttonsHtml}</div>
      <div id="fb"></div>
    </div>`;
}

// ─── ЛОГИКА ───────────────────────────────────────────────────────────────────
function answerOption(idx) {
  if (state.answered) return;
  const c = CASES[state.caseIdx];
  const step = c.steps[state.stepIdx];
  const isCorrect = idx === step.correct;
  state.answered = true;

  document.querySelectorAll('.btn-answer').forEach((b, i) => {
    b.disabled = true;
    if (i === step.correct) b.classList.add('correct');
    if (i === idx && !isCorrect) b.classList.add('wrong');
  });

  handleAnswer(isCorrect, step, c);
}

function answerFolder(folderId) {
  if (state.answered) return;
  const c = CASES[state.caseIdx];
  const step = c.steps[state.stepIdx];
  const isCorrect = folderId === step.correct;
  state.answered = true;

  document.querySelectorAll('.btn-folder').forEach(b => {
    b.disabled = true;
    b.onclick = null;
  });
  const correctBtn = document.getElementById('folder-' + step.correct);
  if (correctBtn) correctBtn.classList.add('correct');
  if (!isCorrect) {
    const wrongBtn = document.getElementById('folder-' + folderId);
    if (wrongBtn) wrongBtn.classList.add('wrong');
  }

  handleAnswer(isCorrect, step, c, folderId);
}

function handleAnswer(isCorrect, step, c, folderId) {
  const isLastStep = state.stepIdx === c.steps.length - 1;

  if (isCorrect && !isLastStep) {
    // Промежуточный верный шаг — авто-продвижение, фидбэк не нужен
    setTimeout(() => {
      state.stepIdx++;
      state.answered = false;
      render();
    }, 600);
    return;
  }

  // Верный финальный шаг или ошибка — показываем фидбэк и кнопку «Далее»
  if (isCorrect) {
    if (!state.caseHadError) state.firstTryCorrect++;
    state.completedOutcomes.push(c.outcome);
  } else {
    state.caseHadError = true;
  }

  // Скрываем кнопки, показываем фидбэк на их месте
  const buttonsArea = document.getElementById('buttons-area');
  if (buttonsArea) buttonsArea.style.display = 'none';

  // Текст объяснения
  let text = isCorrect
    ? c.comment
    : (step.wrongFeedbackMap && step.wrongFeedbackMap[folderId]
        ? step.wrongFeedbackMap[folderId]
        : step.wrongFeedback);

  // Правильный ответ (только при ошибке)
  let correctHint = '';
  if (!isCorrect) {
    let correctLabel = '';
    if (step.isFolderPicker) {
      const f = FOLDERS.find(f => f.id === step.correct);
      if (f) correctLabel = f.icon + ' ' + f.name;
    } else {
      correctLabel = step.options[step.correct];
    }
    if (correctLabel) {
      correctHint = `<div class="correct-hint">
        <div class="correct-hint-label">Правильный ответ</div>
        ${correctLabel}
      </div>`;
    }
  }

  const isLastCase = state.caseIdx === CASES.length - 1;
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="feedback-overlay ${isCorrect ? 'ok' : 'err'}">
    <div class="feedback-head">${isCorrect ? '✓ Верно!' : '✕ Не совсем'}</div>
    ${text}${correctHint}
  </div>
  <button class="btn-next show" style="margin-top:12px" onclick="nextCase()">
    ${isLastCase ? 'Посмотреть итоги →' : 'Следующее сообщение →'}
  </button>`;

  notifyHeight();
}

function nextCase() {
  state.caseIdx++;
  state.stepIdx = 0;
  state.answered = false;
  state.caseHadError = false;
  if (state.caseIdx >= CASES.length) state.screen = 'final';
  render();
}

function startGame() {
  state.screen = 'game';
  render();
}

function restartGame() {
  state = {
    screen: 'intro', caseIdx: 0, stepIdx: 0,
    answered: false, caseHadError: false,
    firstTryCorrect: 0, completedOutcomes: []
  };
  render();
}

render();
