<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Симулятор делегирования</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="common.js"></script>

<style>
#app { max-width: 680px; margin: 0 auto; padding: 44px 20px 60px; }

/* ── INTRO ── */
.stages-preview {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0 28px;
}
.stage-prev {
  border-radius: var(--radius-md); padding: 14px;
  border: 1.5px solid var(--border); background: var(--white);
}
.stage-prev-num   { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.stage-prev-title { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
.stage-prev-desc  { font-size: 12px; color: var(--slate); line-height: 1.5; }

/* ── STAGE HEADER ── */
.stage-header { margin-bottom: 24px; }
.stage-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--dark); color: var(--white); padding: 5px 14px;
  border-radius: 20px; font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px;
}
.stage-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
.stage-task {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--radius-md); padding: 14px 16px; font-size: 14px; line-height: 1.65; color: var(--slate);
}

/* ── КАРТОЧКИ СОТРУДНИКОВ ── */
.employees-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.emp-card {
  background: var(--white); border: 2px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.15s, box-shadow 0.18s;
}
.emp-card:hover { border-color: var(--dark); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,59,72,0.1); }

/* После выбора */
.emp-card.selected     { border-color: var(--dark); background: #EEF3FB; box-shadow: 0 0 0 3px rgba(0,59,72,0.12); }
.emp-card.dimmed       { opacity: 0.38; pointer-events: none; }

.emp-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--sand); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 10px;
}
.emp-name { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
.emp-status {
  font-size: 11px; font-weight: 600; color: var(--slate);
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.emp-status.warn  { color: var(--amber); }
.emp-status.good  { color: var(--green); }
.emp-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; padding: 2px 8px; border-radius: 3px; margin-bottom: 8px;
}
.emp-tag.novice  { background: #EEF3FB; color: #1A5FA5; }
.emp-tag.avoid   { background: #F2F2F2; color: #7A7A7A; }
.emp-tag.unconf  { background: var(--amber-bg); color: var(--amber); }
.emp-tag.pro     { background: var(--amber-bg); color: var(--amber); }
.emp-tag.owner   { background: var(--green-bg);  color: var(--green); }
.emp-desc { font-size: 12px; color: var(--slate); line-height: 1.5; }

/* ── СОПКИ — БЛОКИ ── */
.sopki-header {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;
}
.sopki-counter {
  font-size: 13px; color: var(--slate);
}
.sopki-counter strong { color: var(--dark); font-weight: 700; }

.blocks-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.block-item {
  border: 2px solid var(--border); border-radius: var(--radius-md);
  background: var(--white); cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.block-item:hover   { border-color: var(--dark); background: var(--sand); }
.block-item.selected { border-color: var(--dark); background: #EEF3FB; }

/* Revealed states (финал) */
.block-item.reveal-good  { border-color: var(--green); background: var(--green-bg); pointer-events: none; }
.block-item.reveal-trap  { border-color: var(--red);   background: var(--red-bg);   pointer-events: none; }
.block-item.reveal-miss  { border-color: var(--amber); background: var(--amber-bg); pointer-events: none; }
.block-item.reveal-skip  { opacity: 0.35; pointer-events: none; }

.block-inner { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; }
.block-check {
  width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--border);
  flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.15s; background: var(--white);
}
.block-item.selected .block-check { background: var(--dark); border-color: var(--dark); color: var(--white); }
.block-item.reveal-good .block-check { background: var(--green); border-color: var(--green); color: var(--white); }
.block-item.reveal-trap .block-check { background: var(--red);   border-color: var(--red);   color: var(--white); }
.block-item.reveal-miss .block-check { background: var(--amber); border-color: var(--amber); color: var(--white); }

.block-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 4px; color: var(--slate);
}
.block-item.selected .block-label  { color: var(--dark); }
.block-item.reveal-good .block-label { color: var(--green); }
.block-item.reveal-trap .block-label { color: var(--red);   }
.block-item.reveal-miss .block-label { color: var(--amber); }
.block-text { font-size: 13px; line-height: 1.6; color: var(--slate); }

/* ── КНОПКИ ── */
.btn-start, .btn-stage-next, .btn-sopki-proceed {
  display: flex; align-items: center; justify-content: center; width: 100%;
  background: var(--dark); color: var(--white); border: none; border-radius: 4px;
  padding: 14px; font-family: var(--font-body); font-size: 13px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
  transition: background 0.2s, transform 0.15s, opacity 0.2s;
}
.btn-start:hover, .btn-stage-next:hover { background: var(--red); transform: translateY(-1px); }
.btn-sopki-proceed:hover:not(:disabled)  { background: var(--red); transform: translateY(-1px); }
.btn-sopki-proceed:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-stage-next:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-restart {
  width: 100%; background: var(--white); color: var(--dark);
  border: 1.5px solid var(--border); border-radius: 4px; padding: 14px;
  font-family: var(--font-body); font-size: 13px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.btn-restart:hover { border-color: var(--dark); background: var(--sand); }

/* ── ФИНАЛ ── */
.sopki-breakdown {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 20px;
}
.breakdown-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--slate); margin-bottom: 14px;
}
.breakdown-row {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13px; line-height: 1.55; padding: 6px 0;
  border-bottom: 1px solid var(--sand); color: var(--slate);
}
.breakdown-row:last-child { border-bottom: none; }
.breakdown-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }

.summary-stages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.summary-stage { border-radius: var(--radius-md); padding: 16px 18px; border: 1.5px solid; }
.summary-stage.best    { background: var(--green-bg); border-color: var(--green-border); }
.summary-stage.ok      { background: var(--amber-bg); border-color: var(--amber-border); }
.summary-stage.bad     { background: var(--red-bg);   border-color: var(--red-border);   }
.summary-stage-num   { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; color: var(--slate); }
.summary-stage-title { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
.summary-stage-text  { font-size: 13px; line-height: 1.6; color: var(--slate); }

@media (max-width: 480px) {
  .employees-grid { grid-template-columns: 1fr; }
  .stages-preview { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── ДАННЫЕ ────────────────────────────────────────────────────────────────

var EMPLOYEES = [
  {
    id: 'igor', initials: 'ИГ', name: 'Игорь', acc: 'Игоря', gen: 'Игоря',
    desc: 'В компании 2 месяца. Высокая энергия, готов браться за всё, но регулярно совершает ошибки в простых регламентах.',
    quality: 'bad',
    outcome: {
      perfect: 'Даже чёткая постановка не помогла — у Игоря просто нет нужных компетенций и связей. Несколько раз приходилось вмешиваться лично. Регламент появился, но с задержкой в три недели и при вашем прямом участии.',
      partial:  'Нечёткая постановка плюс недостаточный опыт — Игорь быстро потерял ориентиры. Проект фактически вёлся вами, а не им.',
      trap:     'Попытка проверять каждый шаг дала предсказуемый результат: Игорь ждал одобрения на любое действие — задача осталась вашей.'
    }
  },
  {
    id: 'marina', initials: 'МА', name: 'Марина', acc: 'Марину', gen: 'Марины',
    desc: 'В компании 2 года. Делает ровно то, что прописано в инструкции. На новые задачи отвечает: «Боюсь подвести отдел».',
    quality: 'bad',
    outcome: {
      perfect: 'Марина получила отличное сообщение, но тип мотивации не поменяешь формулировками. Первые две недели «изучала вопрос», потом «уточняла детали». К дедлайну был готов черновик.',
      partial:  'Без чётких ожиданий и понимания, что от неё хотят, Марина нашла десяток причин ничего не делать. Дедлайн провален, задача вернулась к вам.',
      trap:     'Попытка контролировать каждый шаг дала Марине официальный повод тормозить: «Жду вашего ответа — пока ничего не могу сделать».'
    }
  },
  {
    id: 'katya', initials: 'КА', name: 'Катя', acc: 'Катю', gen: 'Кати',
    desc: 'Высокие компетенции, знает процесс в деталях. При обсуждении новых задач спрашивает: «А вы уверены, что это должна делать я?»',
    quality: 'ok',
    outcome: {
      perfect: 'Акцент на полномочиях и значимости помог Кате поверить в себя. Несколько уточняющих вопросов по ходу — но финал она провела сама. Качество высокое.',
      partial:  'Без чёткого понимания, что именно её полномочия, Катя запрашивала одобрения на каждое решение. Де-факто делегирования не произошло — всё шло через вас.',
      trap:     'Микроконтроль только укрепил её сомнения в своих силах. Формально она работала, но в копии каждого письма и каждого решения стояли вы.'
    }
  },
  {
    id: 'alexey', initials: 'АЛ', name: 'Алексей', acc: 'Алексея', gen: 'Алексея',
    desc: 'Стабильный эксперт, выполняет задачи качественно, всегда на связи. Загрузка сейчас близка к максимальной.',
    quality: 'ok',
    outcome: {
      perfect: 'Алексей справился и сдал вовремя — компетенции есть. Но через месяц пришёл с разговором: «Давай перераспределим нагрузку, иначе я не выдержу». Будьте готовы.',
      partial:  'Неполная постановка заставила Алексея додумывать ожидания. Задача сделана, но с нервным напряжением и ощущением «меня опять нагрузили без объяснений».',
      trap:     'Микроменеджмент поверх и без того критической загрузки сломал последний барьер. Задача выполнена — но на следующей неделе Алексей положил заявление на стол.'
    }
  },
  {
    id: 'boris', initials: 'БО', name: 'Борис', acc: 'Бориса', gen: 'Бориса',
    desc: 'Опытный специалист. Требует автономии, не терпит микроменеджмента. Готов отвечать за проект головой.',
    quality: 'best',
    outcome: {
      perfect: 'Борис взял проект в полное управление. Регламент готов, смежники согласовали, команда обучена. Вы получили короткий email с итогами — и больше не думали об этой задаче.',
      partial:  'Борис справился, хотя нечёткость по полномочиям несколько раз заставила его уточнять у вас мелкие вещи. Результат достойный — но могло быть чище.',
      trap:     'Борис сделал задачу качественно. Но ваш микроконтроль его раздражал. По завершении сказал прямо: «В следующий раз — только полная автономия, иначе откажусь».'
    }
  }
];

var BLOCKS = [
  {
    id: 'essence', label: 'Суть задачи', trap: false, required: true,
    text: 'Поручаю тебе полностью взять на себя проект системы контроля качества. На выходе нужен работающий регламент к 20 числу.'
  },
  {
    id: 'micro', label: 'Проверка каждого шага', trap: true, required: false,
    text: 'Присылай мне черновик каждой страницы регламента — я буду лично проверять каждую формулировку и вносить правки.'
  },
  {
    id: 'benefit', label: 'Значимость', trap: false, required: true,
    text: 'Успех этого проекта позволит нам сократить ошибки вдвое, а тебе — подтвердить статус ведущего эксперта в управлении.'
  },
  {
    id: 'exec', label: 'Взять переговоры на себя', trap: true, required: false,
    text: 'Я сам договорюсь с IT-отделом о доступах для тебя — ты просто напиши текст.'
  },
  {
    id: 'resp', label: 'Полномочия', trap: false, required: true,
    text: 'Финальное решение по методике проверки оставляю за тобой. Ты отвечаешь за то, чтобы смежники приняли этот формат.'
  },
  {
    id: 'control', label: 'Формат связи', trap: false, required: true,
    text: 'Договоримся так: ты сам присылаешь краткий статус раз в две недели. Если появятся блокирующие проблемы — выходи на связь сразу.'
  }
];

var REQUIRED_IDS = ['essence', 'resp', 'benefit', 'control'];
var TRAP_IDS     = ['micro', 'exec'];

// ─── СОСТОЯНИЕ ─────────────────────────────────────────────────────────────
var state = {
  screen: 'intro',
  selectedEmployee: null,
  selectedBlocks: []
};

// ─── ВСПОМОГАТЕЛЬНЫЕ ───────────────────────────────────────────────────────
function getSopkiQuality() {
  var sel = state.selectedBlocks;
  if (!sel.length) return 'partial';
  var hasTrap = sel.some(function(id) { return TRAP_IDS.indexOf(id) >= 0; });
  var allRequired = REQUIRED_IDS.every(function(id) { return sel.indexOf(id) >= 0; });
  if (hasTrap) return 'trap';
  if (allRequired) return 'perfect';
  return 'partial';
}

// ─── РЕНДЕР ЭКРАНОВ ────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if      (state.screen === 'intro')  app.innerHTML = renderIntro();
  else if (state.screen === 'stage1') app.innerHTML = renderStage1();
  else if (state.screen === 'stage2') app.innerHTML = renderStage2();
  else if (state.screen === 'final')  app.innerHTML = renderFinal();
  window.scrollTo(0, 0);
  notifyHeight();
}

function renderIntro() {
  return '<div class="intro anim-fade-up">'
    + '<h1 class="page-title">Делегирование:<span>выбор и постановка</span></h1>'
    + '<div class="divider"></div>'
    + '<div class="legend-box">'
      + '<div class="legend-tag">Задача</div>'
      + 'Вам необходимо делегировать разработку новой системы контроля качества внутри отдела. '
      + 'Задача требует знания процессов и готовности нести ответственность перед другими департаментами.<br><br>'
      + 'Это проект, который <strong>серьёзно разгрузит вас в будущем</strong> — если вы правильно выберете исполнителя и грамотно поставите задачу.'
    + '</div>'
    + '<div class="stages-preview">'
      + '<div class="stage-prev"><div class="stage-prev-num">Этап 1</div><div class="stage-prev-title">Аудит команды</div><div class="stage-prev-desc">Выберите кандидата из 5 сотрудников</div></div>'
      + '<div class="stage-prev"><div class="stage-prev-num">Этап 2</div><div class="stage-prev-title">Постановка задачи</div><div class="stage-prev-desc">Составьте сообщение по модели СОПКИ</div></div>'
    + '</div>'
    + '<button class="btn-start" onclick="goStage1()">Начать →</button>'
    + '</div>';
}

function renderStage1() {
  var sel = state.selectedEmployee;

  var cards = EMPLOYEES.map(function(e) {
    var cls = 'emp-card';
    if (sel) {
      if (e.id === sel) cls += ' selected';
      else cls += ' dimmed';
    }
    var onclick = sel ? '' : 'onclick="selectEmployee(\'' + e.id + '\')"';
    return '<div class="' + cls + '" ' + onclick + '>'
      + '<div class="emp-avatar">' + e.initials + '</div>'
      + '<div class="emp-name">' + e.name + '</div>'
      + '<div class="emp-desc">' + e.desc + '</div>'
      + '</div>';
  }).join('');

  var btnDisabled = sel ? '' : 'disabled';

  return '<div style="animation:fadeUp 0.4s ease both">'
    + '<div class="stage-header">'
      + '<div class="stage-badge">Этап 1 из 2</div>'
      + '<div class="stage-title">Выберите исполнителя</div>'
      + '<div class="stage-task">Кому из команды вы поручите разработку системы контроля качества?</div>'
    + '</div>'
    + '<div class="employees-grid">' + cards + '</div>'
    + '<button class="btn-stage-next" ' + btnDisabled + ' onclick="goStage2()">Перейти к постановке задачи →</button>'
    + '</div>';
}

function renderStage2() {
  var emp = EMPLOYEES.find(function(e) { return e.id === state.selectedEmployee; });
  var sel = state.selectedBlocks;
  var count = sel.length;
  var canProceed = count >= 1;

  var blocksHtml = BLOCKS.map(function(b) {
    var isSelected = sel.indexOf(b.id) >= 0;
    var cls = 'block-item' + (isSelected ? ' selected' : '');
    return '<div class="' + cls + '" data-block-id="' + b.id + '" onclick="toggleBlock(\'' + b.id + '\')">'
      + '<div class="block-inner">'
        + '<div class="block-check">' + (isSelected ? '✓' : '') + '</div>'
        + '<div>'
          + '<div class="block-label">' + b.label + '</div>'
          + '<div class="block-text">' + b.text + '</div>'
        + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  return '<div class="anim-fade-up">'
    + '<div class="stage-header">'
      + '<div class="stage-badge">Этап 2 из 2</div>'
      + '<div class="stage-title">Постановка задачи по СОПКИ</div>'
      + '<div class="stage-task">'
        + 'Составьте сообщение для <strong>' + emp.gen + '</strong> — '
        + 'отметьте блоки из предложенных ниже, чтобы запустить процесс делегирования. '
        + 'Учитывайте особенности личности ' + emp.gen + '.'
      + '</div>'
    + '</div>'
    + '<div class="sopki-header">'
      + '<div class="sopki-counter">Отмечено: <strong id="block-counter">' + count + '</strong> из ' + BLOCKS.length + '</div>'
    + '</div>'
    + '<div class="blocks-list">' + blocksHtml + '</div>'
    + '<button class="btn-sopki-proceed" id="btn-sopki-proceed" '
      + (canProceed ? '' : 'disabled')
      + ' onclick="goFinal()">Завершить →</button>'
    + '</div>';
}

function renderFinal() {
  var emp      = EMPLOYEES.find(function(e) { return e.id === state.selectedEmployee; });
  var sopkiQ   = getSopkiQuality();
  var sel      = state.selectedBlocks;
  var hasTrap  = sopkiQ === 'trap';
  var isPerfect= sopkiQ === 'perfect';
  var isPartial= sopkiQ === 'partial';

  // ── Общий итог ──
  var icons = { bad:'❌', ok:'⚠️', best:'🏆' };
  var titles = {
    bad:  'Задача вернулась к вам',
    ok:   'Задача выполнена — но с трудом',
    best: 'Делегирование состоялось'
  };
  var outcomeText = emp.outcome[sopkiQ];

  // ── Сводка по этапу 1 ──
  var stage1Cls = emp.quality;
  var stage1Title = emp.quality === 'best'
    ? emp.name + ' — оптимальный выбор'
    : emp.quality === 'ok'
    ? emp.name + ' — допустимый, но не идеальный выбор'
    : emp.name + ' — слабый кандидат для этой задачи';
  var stage1Text = emp.quality === 'best'
    ? 'Хозяйский тип мотивации и наличие свободной ёмкости делают Бориса идеальным кандидатом для делегирования.'
    : emp.quality === 'ok'
    ? (emp.id === 'katya'
        ? 'Катя компетентна, но её неуверенность в себе требует особого подхода в постановке — упора на полномочия и значимость.'
        : 'Алексей справляется качественно, но делегирование ему в момент перегрузки создаёт реальный риск выгорания.')
    : (emp.id === 'igor'
        ? 'Игорю не хватает опыта для проекта такого масштаба — риск провала высок независимо от качества постановки.'
        : 'Избегательный тип мотивации делает Марину ненадёжным исполнителем для ответственного самостоятельного проекта.');

  // ── Сводка по этапу 2 (СОПКИ) ──
  var stage2Cls = hasTrap ? 'bad' : isPerfect ? 'best' : 'ok';
  var stage2Title = hasTrap
    ? 'Постановка подрывает делегирование'
    : isPerfect
    ? 'Постановка выстроена верно'
    : 'Постановка неполная';

  var missing = REQUIRED_IDS.filter(function(id) { return sel.indexOf(id) < 0; });
  var traps   = TRAP_IDS.filter(function(id) { return sel.indexOf(id) >= 0; });

  var stage2Text = hasTrap
    ? 'Выбранные формулировки ('
      + traps.map(function(id) { return BLOCKS.find(function(b) { return b.id === id; }).label; }).join(', ')
      + ') сигнализируют о недоверии и урезают полномочия — это противоречит самой идее делегирования.'
    : isPerfect
    ? 'Все ключевые элементы СОПКИ включены. Контроль сформулирован так, что не воспринимается как слежка.'
    : 'Не включены: ' + missing.map(function(id) { return BLOCKS.find(function(b) { return b.id === id; }).label; }).join(', ') + '. Без них у исполнителя нет полной картины.';

  // ── Визуальный разбор блоков ──
  var breakdownRows = BLOCKS.map(function(b) {
    var wasSelected = sel.indexOf(b.id) >= 0;
    var icon, comment;
    if (wasSelected && b.required) {
      icon = '✓'; comment = b.label + ' — ключевой элемент, включён';
    } else if (wasSelected && b.trap) {
      icon = '⚠'; comment = b.label + ' — ловушка: подрывает автономию';
    } else if (!wasSelected && b.required) {
      icon = '✗'; comment = b.label + ' — не включён (обязательный элемент)';
    } else {
      return '';
    }
    return '<div class="breakdown-row"><div class="breakdown-icon">' + icon + '</div><div>' + comment + '</div></div>';
  }).join('');

  return '<div class="anim-fade-up">'
    + '<div class="result-hero">'
      + '<div class="result-hero__icon">' + icons[emp.quality] + '</div>'
      + '<div class="result-hero__title">' + titles[emp.quality] + '</div>'
      + '<div class="result-hero__text">' + outcomeText + '</div>'
    + '</div>'
    + '<div class="summary-stages mt-sm">'
      + '<div class="summary-stage ' + stage1Cls + '">'
        + '<div class="summary-stage-num">Этап 1 — Выбор исполнителя</div>'
        + '<div class="summary-stage-title">' + stage1Title + '</div>'
        + '<div class="summary-stage-text">' + stage1Text + '</div>'
      + '</div>'
      + '<div class="summary-stage ' + stage2Cls + '">'
        + '<div class="summary-stage-num">Этап 2 — Постановка задачи</div>'
        + '<div class="summary-stage-title">' + stage2Title + '</div>'
        + '<div class="summary-stage-text">' + stage2Text + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="sopki-breakdown">'
      + '<div class="breakdown-title">Разбор выбранных блоков</div>'
      + (breakdownRows || '<div class="breakdown-row"><div>Ни один блок не был выбран</div></div>')
    + '</div>'
    + '<button class="btn-restart" onclick="restart()">↺ Пройти заново</button>'
    + '</div>';
}

// ─── ЛОГИКА ─────────────────────────────────────────────────────────────────
function goStage1() {
  state.screen = 'stage1';
  state.selectedEmployee = null;
  state.selectedBlocks = [];
  render();
}

function selectEmployee(id) {
  state.selectedEmployee = id;

  // Целевой апдейт карточек без перерендера всей страницы
  document.querySelectorAll('.emp-card').forEach(function(card) {
    card.onclick = null;
    card.classList.add('dimmed');
  });
  var selCard = document.querySelector('.emp-card[onclick]');
  // Перерисовываем только этап 1, так как нужно переключить состояние кнопки
  render();
}

function goStage2() {
  if (!state.selectedEmployee) return;
  state.screen = 'stage2';
  state.selectedBlocks = [];
  render();
}

// Целевой DOM-апдейт при выборе блока — без перерендера страницы
function toggleBlock(id) {
  var idx = state.selectedBlocks.indexOf(id);
  if (idx > -1) {
    state.selectedBlocks.splice(idx, 1);
  } else {
    state.selectedBlocks.push(id);
  }
  var isNowSelected = state.selectedBlocks.indexOf(id) >= 0;

  // Обновляем только конкретный блок
  var blockEl = document.querySelector('[data-block-id="' + id + '"]');
  if (blockEl) {
    blockEl.classList.toggle('selected', isNowSelected);
    var checkEl = blockEl.querySelector('.block-check');
    if (checkEl) checkEl.textContent = isNowSelected ? '✓' : '';
  }

  // Обновляем счётчик
  var counterEl = document.getElementById('block-counter');
  if (counterEl) counterEl.textContent = state.selectedBlocks.length;

  // Обновляем кнопку
  var btn = document.getElementById('btn-sopki-proceed');
  if (btn) {
    var canProceed = state.selectedBlocks.length >= 1;
    btn.disabled = !canProceed;
  }

  notifyHeight();
}

function goFinal() {
  if (!state.selectedBlocks.length) return;
  state.screen = 'final';
  render();
}

function restart() {
  state = { screen: 'intro', selectedEmployee: null, selectedBlocks: [] };
  render();
}

render();
</script>
