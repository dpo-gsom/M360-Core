<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Треугольник Карпмана</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
#app { max-width: 680px; margin: 0 auto; padding: 44px 20px 60px; }

/* ── Роли на интро ── */
.triangle-roles {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 28px;
}
.role-chip { border-radius: 8px; padding: 12px 14px; border: 1.5px solid; text-align: center; }
.role-chip.p { background: var(--red-bg);   border-color: var(--red-border);   }
.role-chip.v { background: #EEF3FB;         border-color: #9DBAE0;             }
.role-chip.r { background: var(--amber-bg); border-color: var(--amber-border); }
.role-chip-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.role-chip.p .role-chip-name { color: var(--red); }
.role-chip.v .role-chip-name { color: #1A5FA5;  }
.role-chip.r .role-chip-name { color: var(--amber); }
.role-chip-desc { font-size: 12px; color: var(--slate); line-height: 1.4; }

/* ── СЦЕНА ── */
.scene-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--dark); color: var(--white);
  padding: 5px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 12px;
}
.scene-title {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  color: var(--dark); margin-bottom: 8px;
}
.scene-context {
  font-size: 13px; color: var(--slate); line-height: 1.65;
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 14px 16px;
}

/* ── ЧАТ ── */
.chat {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 12px; overflow: hidden; margin-bottom: 16px;
}
.chat-header {
  padding: 10px 16px; background: var(--sand); border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 700; color: var(--slate); letter-spacing: 1px; text-transform: uppercase;
}
.chat-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

.msg { display: flex; flex-direction: column; gap: 2px; }
.msg-sender { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--sand); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--slate); flex-shrink: 0;
}
.msg-name { font-size: 12px; font-weight: 700; color: var(--dark); }
.msg-bubble {
  font-size: 13px; line-height: 1.6; color: var(--slate);
  background: var(--sand); border-radius: 0 8px 8px 8px; padding: 10px 14px;
}
.msg-bubble.dm {
  background: #EEF3FB; border-left: 3px solid #1A5FA5; font-style: italic;
}
.msg-dm-label {
  font-size: 10px; font-weight: 700; color: #1A5FA5;
  letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
}

/* ── ВАРИАНТЫ ОТВЕТА ── */
.choice-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--slate); margin-bottom: 10px; margin-top: 16px;
}
.choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.choice-btn {
  background: var(--white); border: 2px solid var(--border); border-radius: 8px;
  padding: 14px 16px; text-align: left; font-family: var(--font-body);
  font-size: 13px; line-height: 1.55; color: var(--slate); cursor: pointer;
  transition: all 0.18s; display: flex; align-items: flex-start; gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
.choice-btn:hover { border-color: var(--dark); background: var(--sand); transform: translateY(-1px); }
.choice-letter {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--sand); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--slate); flex-shrink: 0; margin-top: 1px;
}

/* ── РЕЗУЛЬТАТ ВЫБОРА ── */
.outcome {
  border-radius: 12px; padding: 18px 20px; margin-bottom: 20px;
}
.outcome.bad  { background: var(--red-bg);   border: 1.5px solid var(--red-border);   }
.outcome.warn { background: var(--amber-bg); border: 1.5px solid var(--amber-border); }
.outcome.good { background: var(--green-bg); border: 1.5px solid var(--green-border); }

.outcome-head {
  font-weight: 700; font-size: 13px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.outcome.bad  .outcome-head { color: var(--red);   }
.outcome.warn .outcome-head { color: var(--amber); }
.outcome.good .outcome-head { color: var(--green); }

.outcome-analysis {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--slate); margin-bottom: 8px; margin-top: 12px;
}
.outcome-text { font-size: 13px; line-height: 1.65; }
.outcome.bad  .outcome-text { color: #7A1525;       }
.outcome.warn .outcome-text { color: var(--amber);  }
.outcome.good .outcome-text { color: #1A4A35;       }

/* ── КНОПКИ ── */
.btn-pair { display: flex; gap: 10px; margin-top: 12px; }
.btn-pair .btn { flex: 1; margin: 0; }
.btn-pair .btn--secondary { flex: 0 0 auto; padding-left: 20px; padding-right: 20px; }

/* ── ФИНАЛ ── */
.final { text-align: center; }
.final-icon { font-size: 52px; margin-bottom: 16px; }

.final-trophy {
  background: var(--dark); color: var(--white); border-radius: 12px;
  padding: 28px 24px; margin-bottom: 24px;
}
.final-trophy-title {
  font-family: var(--font-display); font-size: clamp(20px, 5vw, 30px);
  font-weight: 900; margin-bottom: 10px;
}
.final-trophy-sub { font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.75); }

.final-lessons { text-align: left; margin-bottom: 24px; }
.final-lessons-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--slate); margin-bottom: 12px;
}
.final-lesson {
  display: flex; gap: 10px; padding: 10px 14px; border-radius: 8px;
  background: var(--green-bg); border: 1px solid var(--green-border);
  margin-bottom: 8px; font-size: 13px; line-height: 1.55; color: #1A4A35;
}
.lesson-icon { font-size: 16px; flex-shrink: 0; }

@media (max-width: 440px) {
  .triangle-roles { grid-template-columns: 1fr; }
  .btn-pair { flex-direction: column; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="common.js"></script>
<script>
// ── Вспомогательные функции ──────────────────────────────────
function msg(initials, name, text) {
  return '<div class="msg">'
    + '<div class="msg-sender">'
      + '<div class="msg-avatar">' + initials + '</div>'
      + '<div class="msg-name">' + name + '</div>'
    + '</div>'
    + '<div class="msg-bubble">' + text + '</div>'
    + '</div>';
}

function msgDm(initials, name, text) {
  return '<div class="msg">'
    + '<div class="msg-sender">'
      + '<div class="msg-avatar" style="background:#EEF3FB;border-color:#9DBAE0;color:#1A5FA5">' + initials + '</div>'
      + '<div class="msg-name">' + name + '</div>'
      + '<span class="msg-dm-label">→ вам лично</span>'
    + '</div>'
    + '<div class="msg-bubble dm">' + text + '</div>'
    + '</div>';
}

function choice(letter, text, screen) {
  return '<button class="choice-btn" onclick="go(\'' + screen + '\')">'
    + '<div class="choice-letter">' + letter + '</div>'
    + '<div>' + text + '</div>'
    + '</button>';
}

// ── Экраны ───────────────────────────────────────────────────
var SCREENS = {

    + choice('В', 'Катя, давай по делу. Напиши в общий чат конкретный список: каких именно полей от Андрея тебе не хватает для завершения таблицы.', 's1_adult')

  + '<div class="btn-pair">'

  + '</div>'; },

s1_rescuer_recovery: function() { return '<div class="anim-fade-up">'

    + '<div class="outcome-head">✓ Возврат во Взрослую позицию</div>'
    + '<div class="outcome-text">Отличный манёвр! Вы признали ошибку, вышли из роли Спасателя и вернули ответственность реальному исполнителю. Когда вы перестаёте решать проблемы за других, им приходится делать это самостоятельно.</div>'
  + '</div>'
  + '<button class="btn btn--primary btn--full mt-m" onclick="go(\'scene2\')">Перейти к шагу 2 →</button>'
  + '</div>'; },

// --- ШАГ 1: ПУТЬ ПРЕСЛЕДОВАТЕЛЯ (Тупик) ---
s1_pursuer: function() { return '<div class="anim-fade-up">'

// --- ШАГ 2: ПУТЬ ПРЕСЛЕДОВАТЕЛЯ (Тупик) ---
s2_pursuer: function() { return '<div class="anim-fade-up">'
  + '<div class="scene-header" style="margin-bottom:20px">'
    + '<div class="scene-badge">Шаг 2 — Последствия</div>'
    + '<div class="scene-title">Вы отреагировали немедленно</div>'

// ── Навигация ─────────────────────────────────────────────
var navHistory =[];

function go(screen) {
  var app = document.getElementById('app');
  var cur = app.dataset.screen;
  if (cur && cur !== screen) navHistory.push(cur);
  if (screen === 'intro') navHistory =[]; // Сброс истории при рестарте
  app.dataset.screen = screen;
  app.innerHTML = SCREENS[screen]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  notifyHeight();
}

function goBack() {
  if (navHistory.length === 0) return go('intro');
  var prev = navHistory.pop();
  var app = document.getElementById('app');
  app.dataset.screen = prev;
  app.innerHTML = SCREENS[prev]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  notifyHeight();
}

go('intro');
</script>
